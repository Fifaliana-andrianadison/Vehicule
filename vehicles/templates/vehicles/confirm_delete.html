{% extends "base.html" %}
{% block title %}Supprimer {{ vehicle.name }}{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto text-center">
    <div class="bg-white rounded-xl shadow-sm p-8">
        <i class="fas fa-exclamation-triangle text-5xl text-red-500 mb-4"></i>
        <h1 class="text-2xl font-bold text-gray-800 mb-2">Supprimer le véhicule</h1>
        <p class="text-gray-600 mb-6">Êtes-vous sûr de vouloir supprimer <strong>{{ vehicle.name }}</strong> ?<br>Toutes les données associées seront perdues.</p>
        <form method="post" class="flex justify-center gap-3">
            {% csrf_token %}
            <a href="{% url 'vehicles:detail' vehicle.pk %}" class="px-6 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50 transition">Annuler</a>
            <button type="submit" class="bg-red-600 text-white px-6 py-2 rounded-lg font-semibold hover:bg-red-700 transition">
                <i class="fas fa-trash mr-2"></i>Supprimer
            </button>
        </form>
    </div>
</div>
{% endblock %}
